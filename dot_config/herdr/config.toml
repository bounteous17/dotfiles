onboarding = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "cmd+shift+o"
type = "shell"
command = "cursor \"$(git -C \"$HERDR_ACTIVE_PANE_CWD\" rev-parse --show-toplevel 2>/dev/null || echo \"$HERDR_ACTIVE_PANE_CWD\")\""
description = "Open worktree in Cursor"

[[keys.command]]
key = "cmd+shift+up"
type = "shell"
command = "herdr agent prompt \"$HERDR_ACTIVE_PANE_ID\" \"commit and push\""
description = "Tell the agent to commit and push"

[[keys.command]]
key = "cmd+shift+l"
type = "shell"
command = "pane=$(herdr tab create --cwd \"$HERDR_ACTIVE_PANE_CWD\" --label lazygit --focus | jq -r '.result.root_pane.pane_id') && herdr pane run \"$pane\" 'lazygit; exit'"
description = "Open lazygit in a new tab"

[theme]
name = "rose-pine"
auto_switch = false
